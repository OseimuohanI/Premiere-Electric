<svg viewBox="0 0 280 100" xmlns="http://www.w3.org/2000/svg" class="logo-light" role="img" aria-label="Premiere Electric Light">
  <!-- Light variant for dark backgrounds -->
  <defs>
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon circle -->
  <circle cx="30" cy="50" r="28" fill="url(#lightGradient)"/>
  
  <!-- Lightning bolt -->
  <path d="M 30 15 L 22 40 L 32 40 L 26 75 L 38 45 L 28 45 Z" fill="#ff9500" stroke="none"/>
  
  <!-- Plug symbol accent -->
  <circle cx="30" cy="50" r="28" fill="none" stroke="#ff9500" stroke-width="2" opacity="0.3"/>
  
  <!-- Company name -->
  <text x="75" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Premiere</text>
  <text x="75" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ff9500" letter-spacing="2">ELECTRIC</text>
  
  <!-- Horizontal line accent -->
  <line x1="75" y1="72" x2="260" y2="72" stroke="#ff9500" stroke-width="2"/>
</svg>