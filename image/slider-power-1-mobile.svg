<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" role="img" aria-label="Transmission towers over rolling hills">
  <defs>
    <linearGradient id="bg1-mobile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2026" />
      <stop offset="100%" stop-color="#3a424d" />
    </linearGradient>
  </defs>
  <rect width="600" height="1000" fill="url(#bg1-mobile)" />

  <!-- City skyline with buildings -->
  <g fill="#1a1f24" opacity="0.7">
    <!-- Tall building 1 -->
    <rect x="30" y="500" width="70" height="150" />
    <!-- Windows -->
    <g fill="#3d4a5c" opacity="0.6">
      <rect x="38" y="515" width="12" height="16" />
      <rect x="58" y="515" width="12" height="16" />
      <rect x="78" y="515" width="12" height="16" />
      <rect x="38" y="542" width="12" height="16" />
      <rect x="58" y="542" width="12" height="16" />
      <rect x="78" y="542" width="12" height="16" />
      <rect x="38" y="569" width="12" height="16" />
      <rect x="58" y="569" width="12" height="16" />
      <rect x="78" y="569" width="12" height="16" />
      <rect x="38" y="596" width="12" height="16" />
      <rect x="58" y="596" width="12" height="16" />
      <rect x="78" y="596" width="12" height="16" />
      <rect x="38" y="623" width="12" height="16" />
      <rect x="58" y="623" width="12" height="16" />
      <rect x="78" y="623" width="12" height="16" />
    </g>

    <!-- Medium building 2 -->
    <rect x="115" y="460" width="85" height="190" />
    <!-- Windows -->
    <g fill="#3d4a5c" opacity="0.6">
      <rect x="125" y="475" width="14" height="18" />
      <rect x="148" y="475" width="14" height="18" />
      <rect x="171" y="475" width="14" height="18" />
      <rect x="125" y="505" width="14" height="18" />
      <rect x="148" y="505" width="14" height="18" />
      <rect x="171" y="505" width="14" height="18" />
      <rect x="125" y="535" width="14" height="18" />
      <rect x="148" y="535" width="14" height="18" />
      <rect x="171" y="535" width="14" height="18" />
      <rect x="125" y="565" width="14" height="18" />
      <rect x="148" y="565" width="14" height="18" />
      <rect x="171" y="565" width="14" height="18" />
      <rect x="125" y="595" width="14" height="18" />
      <rect x="148" y="595" width="14" height="18" />
      <rect x="171" y="595" width="14" height="18" />
      <rect x="125" y="625" width="14" height="18" />
      <rect x="148" y="625" width="14" height="18" />
      <rect x="171" y="625" width="14" height="18" />
    </g>

    <!-- Short building 3 -->
    <rect x="215" y="550" width="60" height="100" />
    <!-- Windows -->
    <g fill="#3d4a5c" opacity="0.6">
      <rect x="225" y="562" width="11" height="15" />
      <rect x="243" y="562" width="11" height="15" />
      <rect x="261" y="562" width="11" height="15" />
      <rect x="225" y="588" width="11" height="15" />
      <rect x="243" y="588" width="11" height="15" />
      <rect x="261" y="588" width="11" height="15" />
      <rect x="225" y="614" width="11" height="15" />
      <rect x="243" y="614" width="11" height="15" />
      <rect x="261" y="614" width="11" height="15" />
    </g>
  </g>

  <!-- Rolling hills -->
  <path d="M0 680 L200 630 L400 660 L600 640 L600 1000 L0 1000 Z" fill="#2c3239" />
  <path d="M0 720 L180 670 L380 700 L600 680 L600 1000 L0 1000 Z" fill="#353c45" opacity="0.9" />

  <!-- Transmission Tower with Lattice Structure -->
  <g stroke="#c5cdd6" stroke-width="10" stroke-linecap="round" fill="none">
    <!-- Main legs (wider base) -->
    <path d="M220 900 L290 350 L350 350 L420 900" />

    <!-- Cross-arms (wider at bottom, narrower at top) -->
    <path d="M245 780 L395 780" />
    <path d="M265 650 L375 650" />
    <path d="M280 520 L360 520" />
    <path d="M295 420 L345 420" />

    <!-- Top peak -->
    <path d="M290 350 L350 350" />
    <line x1="320" y1="350" x2="320" y2="310" />
  </g>

  <!-- Lattice cross-bracing (thinner) -->
  <g stroke="#a8b2bd" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9">
    <!-- Diagonal bracing -->
    <path d="M245 780 L280 650 M280 650 L265 520" />
    <path d="M395 780 L360 650 M360 650 L375 520" />
    <path d="M265 650 L295 520 M295 520 L280 420" />
    <path d="M375 650 L345 520 M345 520 L360 420" />

    <!-- Horizontal supports -->
    <path d="M290 485 L350 485" />
    <path d="M283 590 L357 590" />
    <path d="M270 715 L370 715" />
  </g>

  <!-- Insulators on cross-arms -->
  <g fill="#485460">
    <circle cx="245" cy="780" r="9" />
    <circle cx="395" cy="780" r="9" />
    <circle cx="265" cy="650" r="8" />
    <circle cx="375" cy="650" r="8" />
    <circle cx="280" cy="520" r="8" />
    <circle cx="360" cy="520" r="8" />
  </g>

  <!-- Power lines connecting to tower -->
  <g stroke="#485460" stroke-width="4" fill="none" opacity="0.8">
    <!-- Lines from left side -->
    <path d="M0 785 L245 780" />
    <path d="M0 655 L265 650" />
    <path d="M0 525 L280 520" />

    <!-- Lines to right side -->
    <path d="M395 780 L600 775" />
    <path d="M375 650 L600 645" />
    <path d="M360 520 L600 515" />
  </g>

  <!-- Power line sag/curve detail -->
  <g stroke="#485460" stroke-width="3" fill="none" opacity="0.6">
    <path d="M0 787 Q120 795 245 782" />
    <path d="M0 657 Q130 665 265 652" />
    <path d="M0 527 Q140 535 280 522" />
    <path d="M395 782 Q500 788 600 777" />
    <path d="M375 652 Q490 656 600 647" />
    <path d="M360 522 Q480 525 600 517" />
  </g>

  <!-- Additional decorative elements -->
  <g stroke="#ffb020" stroke-width="3" fill="none" opacity="0.85">
    <path d="M0 200 C150 160 300 160 450 200" />
    <path d="M450 200 C525 230 600 230 600 200" />
  </g>
  <circle cx="150" cy="180" r="60" fill="#ffb020" opacity="0.12" />
</svg>
