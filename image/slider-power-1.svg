  <path d="M0 560 L520 430 L980 520 L1600 470 L1600 800 L0 800 Z" fill="#2c3239" />
  <path d="M0 520 L480 400 L980 480 L1600 430 L1600 520 L0 520 Z" fill="#353c45" opacity="0.9" />
  <!-- Transmission Tower with Lattice Structure -->
  <g stroke="#c5cdd6" stroke-width="14" stroke-linecap="round" fill="none">
    <!-- Main legs -->
    <path d="M880 670 L1050 210 L1150 210 L1320 670" />

    <!-- Cross-arms (wider at bottom, narrower at top) -->
    <path d="M920 580 L1280 580" />
    <path d="M960 480 L1240 480" />
    <path d="M1000 380 L1200 380" />
    <path d="M1030 280 L1170 280" />

    <!-- Top peak -->
    <path d="M1050 210 L1150 210" />
    <line x1="1100" y1="210" x2="1100" y2="160" />
  </g>

  <!-- Lattice cross-bracing (thinner) -->
  <g stroke="#a8b2bd" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9">
    <!-- Diagonal bracing -->
    <path d="M920 580 L1000 480 M1000 480 L920 380" />
    <path d="M1280 580 L1200 480 M1200 480 L1280 380" />
    <path d="M960 480 L1030 380 M1030 380 L960 280" />
    <path d="M1240 480 L1170 380 M1170 380 L1240 280" />

    <!-- Horizontal supports -->
    <path d="M1050 350 L1150 350" />
    <path d="M1020 450 L1180 450" />
    <path d="M990 550 L1210 550" />
  </g>

  <!-- Insulators on cross-arms -->
  <g fill="#485460">
    <circle cx="920" cy="580" r="12" />
    <circle cx="1280" cy="580" r="12" />
    <circle cx="960" cy="480" r="10" />
    <circle cx="1240" cy="480" r="10" />
    <circle cx="1000" cy="380" r="10" />
    <circle cx="1200" cy="380" r="10" />
  </g>

  <!-- Power lines connecting to tower -->
  <g stroke="#485460" stroke-width="5" fill="none" opacity="0.8">
    <!-- Lines from left side -->
    <path d="M0 585 L920 580" />
    <path d="M0 485 L960 480" />
    <path d="M0 385 L1000 380" />

    <!-- Lines to right side -->
    <path d="M1280 580 L1600 575" />
    <path d="M1240 480 L1600 475" />
    <path d="M1200 380 L1600 375" />
  </g>

  <!-- Power line sag/curve detail -->
  <g stroke="#485460" stroke-width="4" fill="none" opacity="0.6">
    <path d="M0 587 Q460 600 920 582" />
    <path d="M0 487 Q480 500 960 482" />
    <path d="M0 387 Q500 400 1000 382" />
    <path d="M1280 582 Q1440 590 1600 577" />
    <path d="M1240 482 Q1420 488 1600 477" />
    <path d="M1200 382 Q1400 385 1600 377" />
  </g>

  <!-- Additional decorative power lines (sun glow area) -->
  <g stroke="#ffb020" stroke-width="4" fill="none" opacity="0.85">
    <path d="M0 240 C260 180 520 180 760 240" />
    <path d="M760 240 C980 300 1220 300 1600 240" />
  </g>
  <circle cx="220" cy="220" r="90" fill="#ffb020" opacity="0.12" />
</svg>
