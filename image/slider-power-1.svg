    <g fill="#3d4a5c" opacity="0.6">
      <rect x="585" y="415" width="15" height="19" />
      <rect x="612" y="415" width="15" height="19" />
      <rect x="639" y="415" width="15" height="19" />
      <rect x="585" y="447" width="15" height="19" />
      <rect x="612" y="447" width="15" height="19" />
      <rect x="639" y="447" width="15" height="19" />
      <rect x="585" y="479" width="15" height="19" />
      <rect x="612" y="479" width="15" height="19" />
      <rect x="639" y="479" width="15" height="19" />
