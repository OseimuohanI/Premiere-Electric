      <rect x="482" y="335" width="16" height="20" />
      <rect x="509" y="335" width="16" height="20" />
      <rect x="455" y="368" width="16" height="20" />
      <rect x="482" y="368" width="16" height="20" />
      <rect x="509" y="368" width="16" height="20" />
      <rect x="455" y="401" width="16" height="20" />
      <rect x="482" y="401" width="16" height="20" />
      <rect x="509" y="401" width="16" height="20" />
      <rect x="455" y="434" width="16" height="20" />
      <rect x="482" y="434" width="16" height="20" />
      <rect x="509" y="434" width="16" height="20" />
      <rect x="455" y="467" width="16" height="20" />
      <rect x="482" y="467" width="16" height="20" />
      <rect x="509" y="467" width="16" height="20" />
