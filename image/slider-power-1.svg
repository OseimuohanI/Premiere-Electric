    <!-- Short building 3 -->
    <rect x="340" y="440" width="80" height="120" />
    <!-- Windows -->
    <g fill="#3d4a5c" opacity="0.6">
      <rect x="352" y="455" width="14" height="18" />
      <rect x="375" y="455" width="14" height="18" />
      <rect x="398" y="455" width="14" height="18" />
      <rect x="352" y="485" width="14" height="18" />
      <rect x="375" y="485" width="14" height="18" />
      <rect x="398" y="485" width="14" height="18" />
      <rect x="352" y="515" width="14" height="18" />
      <rect x="375" y="515" width="14" height="18" />
      <rect x="398" y="515" width="14" height="18" />
