    <!-- Medium building 2 -->
    <rect x="200" y="340" width="120" height="220" />
    <!-- Windows -->
    <g fill="#3d4a5c" opacity="0.6">
      <rect x="215" y="355" width="18" height="22" />
      <rect x="245" y="355" width="18" height="22" />
      <rect x="275" y="355" width="18" height="22" />
      <rect x="215" y="390" width="18" height="22" />
      <rect x="245" y="390" width="18" height="22" />
      <rect x="275" y="390" width="18" height="22" />
      <rect x="215" y="425" width="18" height="22" />
      <rect x="245" y="425" width="18" height="22" />
      <rect x="275" y="425" width="18" height="22" />
      <rect x="215" y="460" width="18" height="22" />
      <rect x="245" y="460" width="18" height="22" />
      <rect x="275" y="460" width="18" height="22" />
      <rect x="215" y="495" width="18" height="22" />
      <rect x="245" y="495" width="18" height="22" />
      <rect x="275" y="495" width="18" height="22" />
      <rect x="215" y="530" width="18" height="22" />
      <rect x="245" y="530" width="18" height="22" />
      <rect x="275" y="530" width="18" height="22" />
