      <rect x="115" y="395" width="15" height="20" />
      <rect x="140" y="395" width="15" height="20" />
      <rect x="90" y="425" width="15" height="20" />
      <rect x="115" y="425" width="15" height="20" />
      <rect x="140" y="425" width="15" height="20" />
      <rect x="90" y="455" width="15" height="20" />
      <rect x="115" y="455" width="15" height="20" />
      <rect x="140" y="455" width="15" height="20" />
      <rect x="90" y="485" width="15" height="20" />
      <rect x="115" y="485" width="15" height="20" />
      <rect x="140" y="485" width="15" height="20" />
      <rect x="90" y="515" width="15" height="20" />
      <rect x="115" y="515" width="15" height="20" />
