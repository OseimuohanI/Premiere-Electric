<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-label="Smart meter and digital grid infrastructure">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2d3f" />
      <stop offset="100%" stop-color="#2a3a4f" />
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a42" />
      <stop offset="100%" stop-color="#0f2026" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="800" fill="url(#bg2)" />

  <!-- Abstract cityscape -->
  <g class="svg-buildings" fill="#26323d" opacity="0.8">
    <rect x="80" y="500" width="120" height="300" />
    <polygon points="200,500 260,450 320,500 320,800 80,800" />
    <rect x="420" y="520" width="100" height="280" />
    <polygon points="550,480 630,420 710,480 710,800 550,800" />
  </g>

  <!-- Circuit board pattern background -->
  <g class="svg-circuit" stroke="#3a5a7a" stroke-width="3" fill="none" opacity="0.4">
    <path d="M50 150 L250 150 L250 250 L450 250" />
    <path d="M100 300 L300 300 L300 200 L500 200" />
    <path d="M150 450 L350 450 L350 350 L550 350" />
    <circle cx="250" cy="150" r="8" fill="#3a5a7a" />
    <circle cx="300" cy="300" r="8" fill="#3a5a7a" />
    <circle cx="350" cy="450" r="8" fill="#3a5a7a" />
  </g>

  <!-- Smart Meter Device -->
  <g class="svg-smart-meter">
    <!-- Meter body -->
    <rect x="900" y="300" width="380" height="480" rx="8" fill="#26323d" stroke="#3a4a5a" stroke-width="4" />
    <rect x="920" y="320" width="340" height="440" rx="6" fill="#1a2230" />

    <!-- Screen -->
    <rect x="950" y="360" width="280" height="180" rx="4" fill="url(#screen)" stroke="#3a6e82" stroke-width="2" />

    <!-- Display elements -->
    <g fill="#3a7a92" font-family="monospace" font-size="32" font-weight="bold">
      <text x="970" y="420">5,247 kWh</text>
    </g>
    <g fill="#4a8aa2" font-family="monospace" font-size="18">
      <text x="970" y="460">Real-time Usage</text>
      <text x="970" y="490">Peak: 3.2 kW</text>
      <text x="970" y="520">Status: Active</text>
    </g>

    <!-- LED indicators -->
    <circle cx="970" cy="590" r="10" fill="#2a5a42" opacity="0.9" />
    <circle cx="1010" cy="590" r="10" fill="#2a5a42" opacity="0.9" />
    <circle cx="1050" cy="590" r="10" fill="#3a5a7a" opacity="0.9" />
    <circle cx="1090" cy="590" r="10" fill="#3a5a7a" opacity="0.9" />

    <!-- Buttons/Interface -->
    <rect x="960" y="630" width="60" height="40" rx="4" fill="#2a3a4f" stroke="#3a4a5a" stroke-width="2" />
    <rect x="1040" y="630" width="60" height="40" rx="4" fill="#2a3a4f" stroke="#3a4a5a" stroke-width="2" />
    <rect x="1120" y="630" width="60" height="40" rx="4" fill="#2a3a4f" stroke="#3a4a5a" stroke-width="2" />

    <!-- Connection ports -->
    <rect x="940" y="710" width="30" height="30" rx="3" fill="#1f2a36" stroke="#4a5a6a" stroke-width="2" />
    <rect x="990" y="710" width="30" height="30" rx="3" fill="#1f2a36" stroke="#4a5a6a" stroke-width="2" />
  </g>

  <!-- Network connections radiating from meter -->
  <g class="svg-network" stroke="#3a7a92" stroke-width="3" fill="none" opacity="0.6">
    <path d="M1280 450 L1450 350" stroke-dasharray="8,6" />
    <path d="M1280 500 L1480 500" stroke-dasharray="8,6" />
    <path d="M1280 550 L1450 650" stroke-dasharray="8,6" />
    <path d="M900 450 L750 350" stroke-dasharray="8,6" />
    <path d="M900 500 L700 500" stroke-dasharray="8,6" />
    <path d="M900 550 L750 650" stroke-dasharray="8,6" />
  </g>

  <!-- Network nodes -->
  <g class="svg-nodes" fill="#3a7a92" opacity="0.8">
    <circle cx="1450" cy="350" r="12" />
    <circle cx="1480" cy="500" r="12" />
    <circle cx="1450" cy="650" r="12" />
    <circle cx="750" cy="350" r="12" />
    <circle cx="700" cy="500" r="12" />
    <circle cx="750" cy="650" r="12" />
  </g>

  <!-- Additional circuit patterns -->
  <g class="svg-circuit" stroke="#3a5a7a" stroke-width="2" fill="none" opacity="0.4">
    <path d="M1300 150 L1500 150 L1500 250" />
    <path d="M100 600 L200 600 L200 700 L300 700" />
    <circle cx="1500" cy="150" r="6" fill="#3a5a7a" />
    <circle cx="200" cy="600" r="6" fill="#3a5a7a" />
  </g>

  <!-- Data flow particles -->
  <g fill="#2a5a42" opacity="0.7">
    <circle cx="1350" cy="430" r="5" />
    <circle cx="1380" cy="505" r="5" />
    <circle cx="800" cy="480" r="5" />
  </g>
</svg>
