<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-label="Smart meter and digital grid infrastructure">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2332" />
      <stop offset="100%" stop-color="#2d3f5f" />
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4d5c" />
      <stop offset="100%" stop-color="#0d2630" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="800" fill="url(#bg2)" />

  <!-- Abstract cityscape -->
  <g fill="#1f2d42" opacity="0.6">
    <rect x="80" y="500" width="120" height="300" />
    <rect x="220" y="450" width="160" height="350" />
    <rect x="420" y="520" width="100" height="280" />
    <rect x="550" y="480" width="140" height="320" />
  </g>

  <!-- Circuit board pattern background -->
  <g stroke="#3498db" stroke-width="3" fill="none" opacity="0.3">
    <path d="M50 150 L250 150 L250 250 L450 250" />
    <path d="M100 300 L300 300 L300 200 L500 200" />
    <path d="M150 450 L350 450 L350 350 L550 350" />
    <circle cx="250" cy="150" r="8" fill="#3498db" />
    <circle cx="300" cy="300" r="8" fill="#3498db" />
    <circle cx="350" cy="450" r="8" fill="#3498db" />
  </g>

  <!-- Smart Meter Device -->
  <g>
    <!-- Meter body -->
    <rect x="900" y="300" width="380" height="480" rx="8" fill="#2c3e50" stroke="#34495e" stroke-width="4" />
    <rect x="920" y="320" width="340" height="440" rx="6" fill="#1a252f" />

    <!-- Screen -->
    <rect x="950" y="360" width="280" height="180" rx="4" fill="url(#screen)" stroke="#0ea5e9" stroke-width="2" />

    <!-- Display elements -->
    <g fill="#0ea5e9" font-family="monospace" font-size="32" font-weight="bold">
      <text x="970" y="420">5,247 kWh</text>
    </g>
    <g fill="#22d3ee" font-family="monospace" font-size="18">
      <text x="970" y="460">Real-time Usage</text>
      <text x="970" y="490">Peak: 3.2 kW</text>
      <text x="970" y="520">Status: Active</text>
    </g>

    <!-- LED indicators -->
    <circle cx="970" cy="590" r="10" fill="#10b981" opacity="0.9" />
    <circle cx="1010" cy="590" r="10" fill="#10b981" opacity="0.9" />
    <circle cx="1050" cy="590" r="10" fill="#3b82f6" opacity="0.9" />
    <circle cx="1090" cy="590" r="10" fill="#3b82f6" opacity="0.9" />

    <!-- Buttons/Interface -->
    <rect x="960" y="630" width="60" height="40" rx="4" fill="#374151" stroke="#4b5563" stroke-width="2" />
    <rect x="1040" y="630" width="60" height="40" rx="4" fill="#374151" stroke="#4b5563" stroke-width="2" />
    <rect x="1120" y="630" width="60" height="40" rx="4" fill="#374151" stroke="#4b5563" stroke-width="2" />

    <!-- Connection ports -->
    <rect x="940" y="710" width="30" height="30" rx="3" fill="#1f2937" stroke="#6b7280" stroke-width="2" />
    <rect x="990" y="710" width="30" height="30" rx="3" fill="#1f2937" stroke="#6b7280" stroke-width="2" />
  </g>

  <!-- Network connections radiating from meter -->
  <g stroke="#22d3ee" stroke-width="3" fill="none" opacity="0.7">
    <path d="M1280 450 L1450 350" stroke-dasharray="8,6" />
    <path d="M1280 500 L1480 500" stroke-dasharray="8,6" />
    <path d="M1280 550 L1450 650" stroke-dasharray="8,6" />
    <path d="M900 450 L750 350" stroke-dasharray="8,6" />
    <path d="M900 500 L700 500" stroke-dasharray="8,6" />
    <path d="M900 550 L750 650" stroke-dasharray="8,6" />
  </g>

  <!-- Network nodes -->
  <g fill="#22d3ee" opacity="0.8">
    <circle cx="1450" cy="350" r="12" />
    <circle cx="1480" cy="500" r="12" />
    <circle cx="1450" cy="650" r="12" />
    <circle cx="750" cy="350" r="12" />
    <circle cx="700" cy="500" r="12" />
    <circle cx="750" cy="650" r="12" />
  </g>

  <!-- Additional circuit patterns -->
  <g stroke="#3498db" stroke-width="2" fill="none" opacity="0.4">
    <path d="M1300 150 L1500 150 L1500 250" />
    <path d="M100 600 L200 600 L200 700 L300 700" />
    <circle cx="1500" cy="150" r="6" fill="#3498db" />
    <circle cx="200" cy="600" r="6" fill="#3498db" />
  </g>

  <!-- Data flow particles -->
  <g fill="#10b981" opacity="0.7">
    <circle cx="1350" cy="430" r="5" />
    <circle cx="1380" cy="505" r="5" />
    <circle cx="850" cy="470" r="5" />
    <circle cx="820" cy="530" r="5" />
  </g>

  <!-- Power efficiency icon/badge -->
  <g transform="translate(1350, 280)">
    <circle r="50" fill="#10b981" opacity="0.15" />
    <circle r="35" fill="none" stroke="#10b981" stroke-width="3" />
    <path d="M-8 -15 L8 0 L-8 15 Z" fill="#10b981" transform="rotate(90)" />
  </g>
</svg>
